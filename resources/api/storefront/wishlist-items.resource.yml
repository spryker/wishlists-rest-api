resource:
    name: WishlistItems
    shortName: wishlist-items
    description: 'Items inside a customer wishlist. Manipulated as a sub-resource of `/wishlists/{wishlistUuid}/wishlist-items`.'

    processor: Spryker\Glue\WishlistsRestApi\Api\Storefront\Processor\WishlistItemsStorefrontProcessor

    paginationEnabled: false

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: Get
          description: 'Retrieve a wishlist item by its identifier.'
          uriTemplate: '/wishlists/{wishlistUuid}/wishlist-items/{uuid}'
          read: false
          normalizationContext:
              gen_id: false
          openapiContext:
              responses:
                  200:
                      description: 'A single wishlist item.'
                  401:
                      description: 'Unauthenticated.'
                  404:
                      description: 'Wishlist or wishlist item not found.'
          uriVariables:
              wishlistUuid:
                  toProperty: 'wishlist'
                  fromClass: WishlistsStorefrontResource
                  identifiers: [uuid]
              uuid:
                  fromClass: WishlistItemsStorefrontResource

        - type: Post
          description: 'Add an item (by SKU) to the wishlist.'
          uriTemplate: '/wishlists/{wishlistUuid}/wishlist-items'
          read: false
          openapiContext:
              responses:
                  201:
                      description: 'Wishlist item added.'
                  401:
                      description: 'Unauthenticated.'
                  404:
                      description: 'Wishlist not found.'
                  422:
                      description: 'Cannot add item to wishlist.'
          uriVariables:
              wishlistUuid:
                  fromClass: WishlistsStorefrontResource
                  identifiers: [uuid]

        - type: Patch
          description: 'Update a wishlist item by its identifier.'
          uriTemplate: '/wishlists/{wishlistUuid}/wishlist-items/{uuid}'
          read: false
          openapiContext:
              responses:
                  200:
                      description: 'Wishlist item updated.'
                  401:
                      description: 'Unauthenticated.'
                  404:
                      description: 'Wishlist or wishlist item not found.'
                  422:
                      description: 'Unprocessable request.'
          uriVariables:
              wishlistUuid:
                  fromClass: WishlistsStorefrontResource
                  identifiers: [uuid]
              uuid:
                  identifiers: [uuid]

        - type: Delete
          description: 'Remove a wishlist item by its identifier.'
          uriTemplate: '/wishlists/{wishlistUuid}/wishlist-items/{uuid}'
          read: false
          openapiContext:
              responses:
                  204:
                      description: 'Wishlist item deleted.'
                  401:
                      description: 'Unauthenticated.'
                  404:
                      description: 'Wishlist or wishlist item not found.'
          uriVariables:
              wishlistUuid:
                  fromClass: WishlistsStorefrontResource
                  identifiers: [uuid]
              uuid:
                  identifiers: [uuid]

    includes:
        - relationshipName: concrete-products
          targetResource: ConcreteProducts
          uriTemplate: /concrete-products/{sku}
          uriVariableMappings:
              sku: sku

        - relationshipName: merchants
          targetResource: Merchants
          uriTemplate: /merchants/{merchantReference}
          uriVariableMappings:
              merchantReference: merchantReference

    properties:
        uuid:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Unique identifier of the wishlist item.'
            openapiContext:
                example: '209_12309231'

        id:
            type: string
            identifier: false
            writable: false
            readable: true
            required: false
            description: 'Legacy identifier: SKU for plain products, composite key for configured or merchant-offer products.'
            openapiContext:
                example: '209_12309231'

        sku:
            type: string
            writable: true
            readable: true
            required: true
            description: 'SKU of the concrete product to add to the wishlist.'
            openapiContext:
                example: '209_12309231'

        quantity:
            type: integer
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Requested quantity for the wishlist item.'
            openapiContext:
                example: 1

        productConfigurationInstance:
            type: object
            objectName: ProductConfigurationInstance
            writable: true
            readable: true
            required: false
            description: 'DEPRECATED: this property is declared by ProductConfigurationWishlistsRestApi which owns the product-configuration domain. Kept here for backward compatibility; will be removed in the next major. Product configuration instance attached to the wishlist item (for configurable products).'
            properties:
                displayData:
                    type: string
                    description: 'Human-readable configuration display data (JSON-encoded string).'
                    openapiContext:
                        example: '{}'
                configuration:
                    type: string
                    description: 'Raw product configuration payload (JSON-encoded string).'
                    openapiContext:
                        example: '{}'
                configuratorKey:
                    type: string
                    description: 'Identifier of the configurator that produced the instance.'
                    openapiContext:
                        example: CONCRETE_PRODUCT_TYPE
                isComplete:
                    type: boolean
                    description: 'Whether the configuration is complete.'
                    openapiContext:
                        example: false
                availableQuantity:
                    type: integer
                    description: 'Available quantity for the configured product.'
                    openapiContext:
                        example: 5
                prices:
                    type: array
                    description: 'Prices for the configured product instance.'
                    openapiContext:
                        example: []

        wishlist:
            type: WishlistsStorefrontResource
            writable: false
            readable: false
            required: false
            description: 'The parent wishlist (set by the relationship resolver for IRI generation).'
